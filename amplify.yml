version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - cd "$CODEBUILD_SRC_DIR/delegare" && NODE_ENV=development pnpm install --no-frozen-lockfile --prod=false
        build:
          commands:
            - cd "$CODEBUILD_SRC_DIR/delegare/apps/web" && "$CODEBUILD_SRC_DIR/delegare/node_modules/.bin/next" build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../node_modules/**/*
