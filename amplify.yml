version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - corepack enable
            - corepack prepare pnpm@10.28.0 --activate
            - cd ../.. && NODE_ENV=development pnpm install --no-frozen-lockfile --prod=false --ignore-scripts
            - node ../../node_modules/esbuild/install.js 2>/dev/null || true
        build:
          commands:
            - ./node_modules/.bin/next build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../node_modules/**/*
