version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24
            - nvm use 24
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - cd ../.. && NODE_ENV=development pnpm install --no-frozen-lockfile --prod=false
        build:
          commands:
            - cd ../.. && pnpm --filter web build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../node_modules/**/*
