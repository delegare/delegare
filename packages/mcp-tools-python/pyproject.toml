[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delegare-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server and tools for Delegare"
readme = "README.md"
authors = [{ name = "SecureLend", email = "support@securelend.ai" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "delegare",
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.7.0,<3.0.0"
]

[project.urls]
Homepage = "https://delegare.dev"
Repository = "https://github.com/orgtom78/delegare"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/delegare_mcp"]

[tool.uv.sources]
delegare = { workspace = true }

[project.scripts]
delegare-mcp = "delegare_mcp.server:run"
