[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-delegare"
version = "0.1.0"
description = "LangChain integration for Delegare"
readme = "README.md"
authors = [{ name = "SecureLend", email = "support@securelend.ai" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "delegare",
    "langchain-core>=0.3.0,<0.5.0",
    "pydantic>=2.7.0,<3.0.0"
]

[project.urls]
Homepage = "https://delegare.dev"
Repository = "https://github.com/orgtom78/delegare"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "langchain-tests",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_delegare"]

[tool.uv.sources]
delegare = { workspace = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"src/langchain_delegare/tools/*.py" = ["E501"]
"src/langchain_delegare/callbacks.py" = ["E501"]
"src/langchain_delegare/_idempotency.py" = ["E501"]
"examples/**/*.py" = ["E501", "I001", "F401", "F811", "F841", "W293"]
"tests/**/*.py" = ["E501", "I001", "F401", "F811", "W293"]
