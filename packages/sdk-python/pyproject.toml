[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delegare"
version = "0.1.0"
description = "Delegare Python SDK for agent payment authorization and settlement"
readme = "README.md"
authors = [{ name = "SecureLend", email = "support@securelend.ai" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0"
]

[project.urls]
Homepage = "https://delegare.dev"
Documentation = "https://docs.delegare.dev"
Repository = "https://github.com/orgtom78/delegare"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/delegare"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"src/delegare/_http.py" = ["E501"]
"src/delegare/client.py" = ["E501"]
"tests/**/*.py" = ["E501", "I001", "F401", "F811", "W293"]
